[package]
name = "stocks-pie"
version = "1.1.0"
description = "Buy-only portfolio rebalancing that keeps your data on your own device."
license = "MIT"
edition = "2021"

[lib]
name = "stocks_pie_lib"
# cdylib is what Android loads; rlib is what the desktop binary links.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
