[package]
name = "stocks-pie"
version = "1.0.0"
description = "Buy-only portfolio rebalancing that keeps your data on your own computer."
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
